name: Build and test
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and PNG
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libpng-dev
      - name: Configure desktop and CLI
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test (offscreen GUI)
        run: ctest --test-dir build --output-on-failure
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpng-dev
      - name: Install PNG (macOS)
        if: runner.os == 'macOS'
        run: brew install libpng
      - name: Install PNG (Windows)
        if: runner.os == 'Windows'
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libpng:x64-windows'
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCIMATE_BUILD_DESKTOP=OFF
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DSCIMATE_BUILD_DESKTOP=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
  ci:
    name: CI
    if: always()
    needs: [desktop, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all build and test jobs to pass
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$DESKTOP_RESULT" = success && test "$BUILD_RESULT" = success
